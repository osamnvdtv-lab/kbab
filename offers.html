<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d4af37">
<title>بروست وكبابجي الطيب | عروضنا</title>
<style>
:root{--orange:#d4af37;--gold:#f0d36d;--red:#9a7824;--ink:#050505;--cream:#111111;--muted:#c6b98f}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--cream);color:var(--ink)}
a{text-decoration:none;color:inherit}button{font:inherit;cursor:pointer;border:0}
.wrap{width:min(1160px,92%);margin:auto}
header{position:sticky;top:0;z-index:20;background:#111111ee;backdrop-filter:blur(12px);border-bottom:1px solid #f3e4d1}
.nav{height:78px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:23px;color:var(--orange)}
.brand img{width:58px;height:58px;object-fit:contain;border-radius:50%}
.links{display:flex;gap:25px;font-size:14px;font-weight:700}.links a:hover{color:var(--orange)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--orange),var(--red));color:white;padding:13px 22px;border-radius:14px;font-weight:800;box-shadow:0 8px 20px #d4af3730;transition:.2s}
.btn:hover{transform:translateY(-2px);filter:saturate(1.1)}.btn.light{background:#171717;color:var(--red);box-shadow:none;border:1px solid #f6d7b5}
.hero{padding:55px 0 48px;overflow:hidden;background:radial-gradient(circle at 8% 20%,#32240a 0,transparent 32%),linear-gradient(120deg,#111111,#181818)}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:35px}
.eyebrow{display:inline-block;color:#d4af37;background:#2b220e;padding:8px 13px;border-radius:999px;font-size:13px;font-weight:800}
h1{font-size:clamp(36px,5vw,62px);line-height:1.2;margin:18px 0 15px;letter-spacing:-1px}
h1 span{color:var(--orange)}.lead{font-size:18px;line-height:1.9;color:var(--muted);max-width:550px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.note{font-size:12px;color:var(--muted);margin-top:15px}
.hero-art{position:relative;min-height:400px;display:grid;place-items:center}
.food-plate{width:min(410px,95%);aspect-ratio:1;border-radius:50%;background:linear-gradient(135deg,#d6ad42,#d4af37);display:grid;place-items:center;box-shadow:0 30px 65px #b84d1740;position:relative}
.food-plate:before{content:"";position:absolute;inset:18px;border:2px dashed #1717179;border-radius:50%}
.food-plate img{width:77%;height:77%;object-fit:contain;filter:drop-shadow(0 12px 10px #73310020);background:#171717;border-radius:50%;padding:15px}
.sticker{position:absolute;background:white;border-radius:18px;padding:13px 17px;box-shadow:0 12px 30px #6c3b1718;font-weight:900;transform:rotate(-7deg);right:0;bottom:50px;color:var(--red)}
.sticker b{display:block;color:var(--orange);font-size:12px;margin-top:4px}
section{padding:65px 0}.section-head{text-align:center;margin-bottom:32px}.section-head h2{font-size:clamp(27px,4vw,39px);margin:0 0 10px}.section-head p{color:var(--muted);margin:0;line-height:1.8}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:25px}
.feature{background:white;border:1px solid #4b3a17;border-radius:20px;padding:24px;text-align:center}.feature .emoji{font-size:32px}.feature h3{margin:12px 0 7px}.feature p{color:var(--muted);line-height:1.8;margin:0;font-size:14px}
.menu{background:#15120d}.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.food-card{background:#171717;border-radius:22px;overflow:hidden;border:1px solid #493918;box-shadow:0 10px 25px #7040120a;display:flex;flex-direction:column}
.food-img{height:190px;display:grid;place-items:center;font-size:78px;background:radial-gradient(circle,#4a3915,#15120d 70%)}
.food-content{padding:20px;display:flex;flex-direction:column;flex:1}.food-content h3{margin:0 0 8px}.food-content p{color:var(--muted);font-size:14px;line-height:1.7;margin:0 0 16px}
.food-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto}.price{font-size:13px;color:var(--muted);font-weight:700}.add{background:#241c0c;color:#e3c45f;padding:10px 13px;border-radius:11px;font-weight:900}.add:hover{background:#453516}
.offer{background:linear-gradient(110deg,#e83e16,#d4af37);color:white;border-radius:26px;padding:35px;display:flex;align-items:center;justify-content:space-between;gap:20px}.offer h2{font-size:clamp(25px,4vw,38px);margin:0 0 8px}.offer p{margin:0;line-height:1.8;color:#1717171df}.offer .btn{background:white;color:#111111;box-shadow:none;white-space:nowrap}
.order-area{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}.order-panel,.contact-panel{background:white;border:1px solid #493918;border-radius:22px;padding:25px}
.order-panel h3,.contact-panel h3{margin-top:0}.cart-list{display:grid;gap:10px;margin:15px 0}.cart-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#1b1710;padding:12px;border-radius:12px;font-size:14px}.cart-row button{background:#3a2114;color:#e3c45f;border-radius:8px;padding:5px 9px}
.total{border-top:1px dashed #6e5726;padding-top:15px;display:flex;justify-content:space-between;font-weight:900}.empty{color:var(--muted);font-size:14px}
label{display:block;font-size:13px;font-weight:800;margin:13px 0 7px}input,textarea{width:100%;padding:13px;border:1px solid #5a4822;border-radius:12px;background:#121212;font:inherit;outline:none}input:focus,textarea:focus{border-color:var(--orange)}textarea{min-height:90px;resize:vertical}.full{width:100%;margin-top:16px}
.contact-list{display:grid;gap:13px;color:var(--muted);line-height:1.8}.contact-list b{color:var(--ink)}
footer{background:#050505;color:#1717175e6;padding:28px 0}.foot{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.foot small{color:#c6b98f}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#050505;color:white;padding:12px 18px;border-radius:12px;z-index:50;display:none;box-shadow:0 10px 30px #0002}
@media(max-width:800px){.links{display:none}.hero-grid,.order-area{grid-template-columns:1fr}.hero{padding-top:35px}.hero-art{min-height:300px;order:-1}.food-plate{width:min(300px,85%)}.sticker{right:8%;bottom:20px}.features,.menu-grid{grid-template-columns:1fr 1fr}.offer{align-items:flex-start;flex-direction:column}}
@media(max-width:520px){.nav{height:68px}.brand img{width:48px;height:48px}.brand{font-size:20px}.nav>.btn{padding:10px 13px;font-size:13px}.hero-grid{gap:10px}.hero-art{min-height:255px}h1{font-size:38px}.lead{font-size:16px}.features,.menu-grid{grid-template-columns:1fr}.food-img{height:165px}.offer{padding:25px}.foot{justify-content:center;text-align:center}}

.active-link{color:var(--orange)!important}

/* Black & Gold theme — Delk Star */
body{background:#0b0b0b!important;color:#f5e7bd!important}
header{background:#101010ee!important;border-bottom:1px solid #594719!important}
.brand{color:#d4af37!important}
.links a{color:#f5e7bd}
.links a:hover,.active-link{color:#d4af37!important}
.feature,.food-card,.order-panel,.contact-panel{background:#151515!important;border-color:#594719!important;color:#f5e7bd!important}
.menu{background:#101010!important}
.food-img{background:radial-gradient(circle,#4a3915,#151515 72%)!important}
.food-content p,.feature p,.section-head p,.lead,.note,.price,.contact-list{color:#c6b98f!important}
input,textarea{background:#101010!important;color:#f5e7bd!important;border-color:#594719!important}
.cart-row{background:#211a0d!important;color:#f5e7bd!important}
.add{background:#3a2d0e!important;color:#f0d36d!important}
.btn{background:linear-gradient(135deg,#d4af37,#8a6a16)!important;color:#080808!important}
.btn.light{background:#171717!important;color:#f0d36d!important;border-color:#8a6a16!important}
.offer{background:linear-gradient(110deg,#5b4310,#c49a22)!important;color:#080808!important}
.offer p{color:#17130a!important}
footer{background:#000!important;color:#f5e7bd!important;border-top:1px solid #594719}
.sticker{background:#171717!important;color:#f0d36d!important;border:1px solid #8a6a16}
.toast{background:#d4af37!important;color:#080808!important}
.eyebrow{background:#2b220e!important;color:#f0d36d!important}
h1 span{color:#d4af37!important}

</style>

<div class="toast" id="toast"></div>

<script>
const products=[
 {id:1,name:"وجبة بروست الطيب",desc:"قطع بروست مع البطاطس والصوص.",price:150,emoji:"🍗"},
 {id:2,name:"ساندوتش الطيب",desc:"ساندوتش دجاج بطعم مميز.",price:85,emoji:"🍔"},
 {id:3,name:"بوكس الطيب العائلي",desc:"تشكيلة بروست ومشويات للمشاركة.",price:250,emoji:"🍗🍟"}
];
const money=n=>new Intl.NumberFormat('ar-EG').format(n)+" جنيه";
const toast=(msg)=>{const t=document.getElementById("toast");if(!t)return;t.textContent=msg;t.style.display="block";clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display="none",2800);};
if(document.getElementById("year")) document.getElementById("year").textContent=new Date().getFullYear();

if(document.getElementById("menuGrid")){
 document.getElementById("menuGrid").innerHTML=products.map(p=>`<article class="food-card"><div class="food-img" aria-hidden="true">${p.emoji}</div><div class="food-content"><h3>${p.name}</h3><p>${p.desc}</p><div class="food-bottom"><span class="price">${money(p.price)} <small>(سعر تجريبي)</small></span><button class="add" onclick="addToCart(${p.id})">+ أضف للطلب</button></div></div></article>`).join("");
}
function getCart(){try{return JSON.parse(localStorage.getItem("crunchCart")||"{}")}catch(e){return {}}}
function saveCart(c){localStorage.setItem("crunchCart",JSON.stringify(c))}
function addToCart(id){const c=getCart();c[id]=(c[id]||0)+1;saveCart(c);renderCart();toast("اتضاف الصنف لطلبك");}
function removeFromCart(id){const c=getCart();if(c[id]>1)c[id]--;else delete c[id];saveCart(c);renderCart();}
function renderCart(){
 const list=document.getElementById("cartList");if(!list)return;
 const c=getCart(),items=products.filter(p=>c[p.id]);
 if(!items.length){list.innerHTML='<p class="empty">لسه ما ضفتش أي أصناف. اختار من المنيو الأول.</p>';}
 else{list.innerHTML=items.map(p=>`<div class="cart-row"><span>${p.name} × ${c[p.id]}</span><span>${money(p.price*c[p.id])}</span><button type="button" onclick="removeFromCart(${p.id})">−</button></div>`).join("");}
 document.getElementById("total").textContent=money(items.reduce((s,p)=>s+p.price*c[p.id],0));
}
function orderText(){
 const c=getCart(),items=products.filter(p=>c[p.id]),total=items.reduce((s,p)=>s+p.price*c[p.id],0);
 return `طلب جديد من بروست وكبابجي الطيب\nالاسم: ${document.getElementById("customer").value}\nالموبايل: ${document.getElementById("phone").value}\nالعنوان: ${document.getElementById("address").value}\nالأصناف: ${items.map(p=>p.name+" × "+c[p.id]).join("، ")||"لم يتم اختيار أصناف"}\nالإجمالي التقديري: ${money(total)}\nملاحظات: ${document.getElementById("notes").value}`;
}
renderCart();
const form=document.getElementById("orderForm");
if(form)form.addEventListener("submit",e=>{
 e.preventDefault();if(!products.some(p=>getCart()[p.id])){toast("اختار صنف واحد على الأقل من المنيو");return;}
 const text=orderText(),blob=new Blob([text],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download="طلب-الطيب.txt";a.click();URL.revokeObjectURL(a.href);
